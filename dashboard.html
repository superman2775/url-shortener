<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>URL Shortener Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #dashboard {
      margin-top: 1rem;
    }
    .entry {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .entry input {
      flex: 1;
    }
    .add-btn {
      margin-top: 1rem;
    }
    .code-pre {
      margin-top: 1rem;
      font-size: 0.9rem;
      background: #f0f0f0;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Shortener Dashboard</h1>
    <p>Edit short links below, then <strong>copy the JSON and paste it into `redirects.json` on GitHub</strong>.</p>

    <div id="dashboard"></div>

    <button id="add-btn" class="add-btn">+ Add new short link</button>
    <button id="copy-json-btn">Copy updated JSON</button>

    <pre id="json-output" class="code-pre"></pre>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
